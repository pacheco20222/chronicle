name: Release

# Builds the wheel (with the dashboard bundled) and smoke-tests it on every run.
# It only publishes to PyPI when a version tag (v*) is pushed, through PyPI
# trusted publishing: configure the "pypi" environment and a trusted publisher
# for this repository on pypi.org first. No token is stored in GitHub.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Build the dashboard and bundle it into the package
        run: |
          (cd dashboard && npm ci && npm run build)
          cp -R dashboard/dist src/chronicle/dashboard_dist
      - run: uv build
      - name: Smoke-test the wheel in a clean virtualenv
        run: uv run python scripts/smoke_wheel.py dist/*.whl --expect-dashboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
