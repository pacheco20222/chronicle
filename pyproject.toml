[project]
name = "chronicle-memory"
version = "3.2.0"
description = "Self-hosted, project-scoped memory MCP server for Claude Code, Cursor, Codex and Claude Desktop"
keywords = ["mcp", "memory", "claude", "codex", "cursor", "ai-agents", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jose Pacheco", email = "jrp2022@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.4",
    "fastmcp>=3.4.7",
    "sqlalchemy==2.0.43",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/pacheco20222/chronicle"
Repository = "https://github.com/pacheco20222/chronicle"
Changelog = "https://github.com/pacheco20222/chronicle/blob/main/CHANGELOG.md"
Issues = "https://github.com/pacheco20222/chronicle/issues"

[project.optional-dependencies]
# similarity search; without it Chronicle is SQLite + keyword search only
semantic = [
    "fastembed>=0.8.0",
    "qdrant-client>=1.19.0",
]

[project.scripts]
chronicle = "chronicle.cli:main"
chronicle-recall = "chronicle.recall:main"

[tool.uv.build-backend]
module-name = "chronicle"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "fastembed>=0.8.0",
    "qdrant-client>=1.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-dir = ".uv-cache"
